name: Air conditioner
products:
  - id: f3goccgfj6qino4d
    manufacturer: AIRMART
    model: AM35TK5-IU
entities:
  - entity: climate
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: auto
                value: auto
              - dps_val: cold
                value: cool
              - dps_val: wet
                value: dry
              - dps_val: hot
                value: heat
              - dps_val: wind
                value: fan_only
              - dps_val: null
                value: "off"
                hidden: true
      - id: 2
        type: integer
        name: temperature
        range:
          min: 16
          max: 30
        mapping:
          - scale: 1
            step: 1
      - id: 3
        type: integer
        name: current_temperature
        mapping:
          - scale: 2
      - id: 4
        type: string
        name: mode
        hidden: true
        optional: true
      - id: 5
        type: string
        name: fan_mode
        mapping:
          - dps_val: "auto"
            value: "auto"
          - dps_val: "low"
            value: "low"
          - dps_val: "mid"
            value: "medium"
          - dps_val: "high"
            value: "high"
      - id: 117
        type: string
        name: swing_mode
        mapping:
          - dps_val: ud_0c
            value: "on"
          - dps_val: ud_00
            value: "off"
          - value: "off"
            hidden: true
  - entity: light
    translation_key: backlight
    category: config
    dps:
      - id: 13
        name: switch
        type: boolean
  - entity: switch
    # translation_key: beep
    category: config
    dps:
      - id: 16
        type: boolean
        name: switch

#DP 1: on off
##2: target temp
##3: current temp scale 0.5
##4: hvac mode - cold etc
##5: fan speed
##
##107: turbo bool
##108: quiet bool excluded 107
#

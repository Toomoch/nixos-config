  schedule:
    - cron: '0 0 * * 0' # runs weekly on Sunday at 00:00

jobs:
  lockfile:
    runs-on: nix-x86_64-linux
    environment: update
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - run: nix-shell --command "just build h81"
